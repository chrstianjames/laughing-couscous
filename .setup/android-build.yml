name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          build-root-directory: android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -x
          SDKMAN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then
            SDKMAN=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          if [ -z "$SDKMAN" ]; then
            cd "$ANDROID_SDK_ROOT"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            mkdir -p cmdline-tools/latest
            unzip -q cmdline-tools.zip
            mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
            rm cmdline-tools.zip
            SDKMAN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMAN"
          fi
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Download Gradle Wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL --retry 3 -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
        working-directory: android

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        working-directory: android

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: android

      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shortly-release-apk
          path: android/${{ steps.apk.outputs.path }}
          if-no-files-found: error
