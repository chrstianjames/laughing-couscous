; Picked up automatically by PHP-CGI / PHP-FPM (mod_php uses the php_value
; block in .htaccess instead). Lets 100MB videos upload and stream.
upload_max_filesize = 100M
post_max_size = 110M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
output_buffering = Off
zlib.output_compression = Off
